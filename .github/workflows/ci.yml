# SPDX-License-Identifier: MIT
# SDK-free checks: repository hygiene, Python syntax, and a native build of the shader translator.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Repository hygiene
        run: tools/check-files
      - name: Python syntax
        run: python3 -m compileall -q tools
      - name: Shader translator (native build)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang cmake ninja-build
          cmake -S src/gpucode -B build-native -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          cmake --build build-native
